# Copy to smashrate.toml and edit. Every section is optional; defaults run the web UI only.

[server]
addr = ":8080"
database = "data/smashrate.db"
data_dir = "data"
# Used in Slack messages to link to the web UI (LAN address, or the public hostname
# when published through Cloudflare Tunnel; see docs/DEPLOY.md).
base_url = "http://192.168.1.50:8080"

[server.auth]
# Empty password = no login (LAN-only use). With a password, recording, editing
# and deleting require a login; set read_requires_login to protect pages too.
password = ""
api_token = ""
read_requires_login = false
# Trust Cloudflare Access's Cf-Access-Authenticated-User-Email header as a login.
# Only with addr = "127.0.0.1:8080" so the port is reachable through the tunnel alone.
trust_cloudflare_access = false

[slack]
enabled = false
# Socket Mode: no public URL needed. Create an app at https://api.slack.com/apps,
# enable Socket Mode (app-level token with connections:write), add a slash command
# named /smash, and give the bot scopes commands, chat:write.
bot_token = "xoxb-..."
app_token = "xapp-..."
# Channel id for automatic-record notifications (optional).
channel = ""
command = "/smash"

[vision]
enabled = false
ffmpeg = "ffmpeg"
# Windows: dshow + "video=<device name>" (find it with `smashrate vision devices`)
# Linux:   v4l2  + "/dev/video0"
# macOS:   avfoundation + "0"
input_format = "dshow"
input = "video=USB Video"
# Extra input options, e.g. forcing the capture resolution:
# input_args = ["-video_size", "1920x1080", "-framerate", "30"]
width = 640
height = 360
# The results screen can be short: 4 frames/s with 2 identical readings in a
# row detects it within half a second. OCR then runs on the captured frame,
# so the screen may disappear right after.
fps = 4
stable_frames = 2
cooldown_seconds = 90
# Hamming distance (0-64) allowed between a region hash and a learned template.
screen_threshold = 10
char_threshold = 12
rank_threshold = 10
name_threshold = 10

# Name-tag OCR: runs only for a tag never seen before, then the tag is
# remembered as an image hash. New names create players automatically.
[vision.ocr]
engine = "auto"      # auto = Windows built-in OCR on Windows, none elsewhere; or "command"
language = "ja"
scale = 3            # enlarge the crop before recognition
timeout_seconds = 15
# engine = "command"; command = "tesseract {image} - -l jpn"

# Layouts are fractions of the frame (0..1). The defaults are a starting point;
# tune them with `smashrate vision regions -image shot.png -players 2` until the
# crops in data/regions/ show exactly the fighter portrait, the placement badge
# and the player's name tag. The team-battle results screen arranges players
# differently, so it has its own layouts with mode = "team" (tune and teach them
# from a team-battle screenshot with -mode team).
# [[vision.layouts]]
# players = 2
# mode = ""        # "" = 1on1 / free-for-all, "team" = team battle
# screen = { x = 0.0, y = 0.86, w = 1.0, h = 0.14 }
# slots = [
#   { port = 1, char = { x = 0.075, y = 0.30, w = 0.35, h = 0.35 }, rank = { x = 0.05, y = 0.08, w = 0.175, h = 0.14 }, name = { x = 0.05, y = 0.67, w = 0.40, h = 0.08 } },
